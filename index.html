<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#fdf6ec" />
    <meta name="description" content="喵呜安家：每行、每列、每个色块只住一只猫的逻辑解谜，40 关手工验证，无需下载。" />
    <meta property="og:title" content="喵呜安家 · 猫咪逻辑解谜" />
    <meta property="og:description" content="每行、每列、每个色块只住一只猫。40 关，每关只有唯一解。" />
    <meta property="og:type" content="website" />
    <link rel="icon" href="data:," />
    <title>喵呜安家</title>
    <style>
      /* 这些变量由 config/theme.ts 的 applyThemeVars() 覆盖；这里的值只是首屏兜底 */
      :root {
        --bg: #fdf6ec;
        --text: #3b2f2a;
        --muted: #9c8b7d;
        --primary: #ff8fab;
        --primary-text: #3b2f2a;
        --frame: #e4d5c3;
        --surface: #ffffff;
        --heart: #ff5a5f;
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body {
        margin: 0; height: 100%;
        background: var(--bg); color: var(--text);
        font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        overscroll-behavior: none;
        transition: background-color 0.2s;
      }
      #app {
        height: 100%; display: flex; flex-direction: column;
        max-width: 560px; margin: 0 auto;
        /* 刘海与 home indicator：给按钮留出可点区域，别被系统手势条压住 */
        padding: calc(10px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right))
          calc(14px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left));
      }
      header {
        display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
        padding: 6px 2px 10px; font-weight: 600; font-size: 15px;
      }
      #level { justify-self: start; }
      #hearts { justify-self: center; color: var(--heart); letter-spacing: 2px; font-size: 16px; }
      .actions { justify-self: end; display: flex; gap: 8px; }
      #help, #sound {
        width: 30px; height: 30px; border-radius: 50%;
        border: none; background: var(--surface); color: var(--muted);
        font-size: 14px; font-weight: 700; cursor: pointer;
        box-shadow: 0 1px 0 var(--frame);
      }
      #help:active, #sound:active { transform: translateY(1px); box-shadow: none; }
      .wrap { position: relative; flex: 1; display: flex; flex-direction: column; min-height: 0; }
      #coach {
        margin: 0 2px 8px; padding: 10px 14px; border-radius: 14px;
        background: var(--surface); color: var(--text);
        font-size: 14px; line-height: 1.55; box-shadow: 0 1px 0 var(--frame);
      }
      #coach[hidden] { display: none; }
      #board { flex: 1; width: 100%; min-height: 0; display: block; touch-action: manipulation; }
      footer { display: flex; gap: 10px; padding-top: 12px; }
      footer button {
        flex: 1; padding: 12px 8px; border: none; border-radius: 14px;
        background: var(--surface); color: var(--text); font-size: 15px; font-weight: 600;
        box-shadow: 0 2px 0 var(--frame); cursor: pointer;
      }
      footer button:active { transform: translateY(1px); box-shadow: none; }
      #overlay {
        position: absolute; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 18px;
        background: color-mix(in srgb, var(--bg) 92%, transparent);
        backdrop-filter: blur(2px); border-radius: 16px;
      }
      #overlay[hidden] { display: none; }
      #overlay-text { font-size: 22px; font-weight: 700; }
      #overlay-button {
        padding: 13px 34px; border: none; border-radius: 999px;
        background: var(--primary); color: var(--primary-text);
        font-size: 16px; font-weight: 700; cursor: pointer;
      }
      #rules {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        background: rgba(0, 0, 0, 0.35); padding: 24px; z-index: 10;
      }
      #rules[hidden] { display: none; }
      #rules .card {
        background: var(--surface); color: var(--text);
        border-radius: 20px; padding: 24px 22px; max-width: 400px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.22);
      }
      #rules h2 { margin: 0 0 12px; font-size: 18px; }
      #rules p { margin: 0 0 18px; font-size: 14px; line-height: 1.75; color: var(--muted); white-space: pre-line; }
      #rules button {
        width: 100%; padding: 12px; border: none; border-radius: 14px;
        background: var(--primary); color: var(--primary-text);
        font-size: 15px; font-weight: 700; cursor: pointer;
      }
      #toast {
        position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%) translateY(8px);
        background: rgba(35, 28, 24, 0.92); color: #fff; padding: 8px 16px;
        border-radius: 999px; font-size: 13px; opacity: 0; pointer-events: none;
        transition: opacity 0.18s, transform 0.18s;
      }
      #toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
  </head>
  <body>
    <div id="app">
      <header>
        <span id="level">第 1 关</span>
        <span id="hearts">❤❤❤</span>
        <div class="actions">
          <button id="sound" aria-label="音效开关">🔊</button>
          <button id="help" aria-label="玩法说明">?</button>
        </div>
      </header>
      <div id="coach" hidden><span id="coach-text"></span></div>
      <div class="wrap">
        <canvas id="board"></canvas>
        <div id="overlay" hidden>
          <div id="overlay-text"></div>
          <button id="overlay-button">下一关</button>
        </div>
      </div>
      <footer>
        <button id="undo">撤销</button>
        <button id="hint">提示</button>
        <button id="restart">重来</button>
      </footer>
    </div>

    <div id="rules" hidden>
      <div class="card">
        <h2>怎么玩</h2>
        <p id="rules-text"></p>
        <button id="rules-close">知道了</button>
      </div>
    </div>

    <div id="toast"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
